<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deployment">
<link rel="manifest" href="manifest.webmanifest">
<title>Better Buzz Deployment</title>
<style>
:root{--black:#202020;--off:#f4f4f2;--yellow:#ffc400;--orange:#f57c2a;--green:#5ba915;--gray:#efefed;--text:#1f1f1f}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--off);color:var(--text);min-height:100vh}
header{background:var(--black);color:#fff;padding:15px 22px;position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:900}.sub{font-size:13px;color:#cfcfcf;margin-top:3px}
main{width:min(1250px,100%);margin:auto;padding:22px}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:34px}.kicker{font-size:17px;font-weight:800;margin-bottom:18px}
.day-wrap{margin:4px 0 22px}.day-label{font-size:12px;font-weight:900;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.day-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day-btn{border:0;border-radius:13px;background:#e7e7e5;padding:12px 5px;font-size:14px;font-weight:900;cursor:pointer;min-width:0}
.day-btn.active{background:var(--yellow)}
.day-status{margin-top:8px;font-size:13px;color:#666}
.play-count{display:flex;gap:10px;margin:12px 0 22px}.play-count button,.staff-btn{border:0;border-radius:13px;background:#e7e7e5;font-weight:900;cursor:pointer}
.play-count button{padding:12px 18px;font-size:17px}.play-count button.active,.staff-btn.active{background:var(--yellow)}
.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.plan-card{border:2px solid #ececea;border-radius:18px;padding:16px;background:#fafafa;min-width:0}
.play-label{width:100%;border:0;border-bottom:2px solid #ddd;background:transparent;font-size:20px;font-weight:900;padding:6px 4px 10px;outline:none}
.play-label:focus{border-color:var(--yellow)}
.staff-label{font-size:12px;font-weight:900;color:#666;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.4px}
.staff-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.staff-btn{padding:10px 5px;font-size:16px}
.roles{display:grid;gap:9px;margin-top:14px}.role{background:var(--gray);border-radius:13px;padding:10px;display:grid;grid-template-columns:38px 1fr;gap:9px;align-items:center}
.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}.planted{background:var(--orange)}.non-planted{background:var(--green)}
.role-title{font-weight:900;font-size:15px}.secondary{font-size:12px;color:#666;margin-top:2px}
.name-input{width:100%;margin-top:6px;border:2px solid transparent;background:#fff;border-radius:9px;padding:9px 10px;font-size:15px;outline:none}.name-input:focus{border-color:var(--yellow)}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.primary,.secondary-btn{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:900;cursor:pointer}.primary{background:var(--yellow);color:#111;flex:1}.secondary-btn{background:#dededb}
.hidden{display:none!important}
.live-top{display:flex;justify-content:space-between;align-items:center;gap:16px}.live-label{font-size:14px;font-weight:900;color:#666}.live-day{font-size:15px;font-weight:900;color:#666;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}.live-name{font-size:34px;font-weight:900}.live-count{font-size:56px;font-weight:900;color:var(--yellow)}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.timeline button{border:0;border-radius:14px;padding:11px;background:#e8e8e6;font-weight:900;cursor:pointer}.timeline button.active{background:var(--yellow)}.timeline button.future{opacity:.7}
.live-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.live-role{background:#f0f0ee;border-left:11px solid var(--green);border-radius:14px;padding:14px}.live-role.is-planted{border-left-color:var(--orange)}.live-role .r{font-size:18px;font-weight:900}.live-role .s{font-size:13px;color:#666;margin-top:3px}.live-role .who{font-size:25px;font-weight:900;margin-top:8px}
.next-strip{margin-top:16px;border-radius:14px;background:#202020;color:#fff;padding:13px 15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.next-strip b{color:var(--yellow)}
.notice{margin-top:14px;color:#666;font-size:13px}
@media(max-width:950px){.plan-grid{grid-template-columns:1fr}.live-grid{grid-template-columns:1fr}.day-tabs{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){main{padding:12px}.card{padding:16px;border-radius:16px}h1{font-size:28px}.timeline{grid-template-columns:1fr}.live-top{align-items:flex-start}.live-name{font-size:28px}.day-tabs{grid-template-columns:repeat(4,1fr)}.day-btn{font-size:13px;padding:11px 4px}}
</style>
</head>
<body>
<header><div class="brand">Peak Deployment Planner</div><div class="sub">Plan Monday–Sunday • pre-peak → peak → transition out</div></header>
<main>
<section id="setup" class="card">
  <h1>Build This Week’s Plays</h1>
  <div class="kicker">Choose a day, build 2–3 plays, and assign the team ahead of time.</div>

  <div class="day-wrap">
    <div class="day-label">Day of week</div>
    <div class="day-tabs" id="dayTabs"></div>
    <div class="day-status" id="dayStatus"></div>
  </div>

  <div class="play-count">
    <button id="twoBtn">2 Plays</button>
    <button id="threeBtn">3 Plays</button>
  </div>
  <div id="planGrid" class="plan-grid"></div>
  <div class="actions">
    <button class="secondary-btn" id="clearBtn">Clear This Day</button>
    <button class="primary" id="startBtn">Start Live Deployment</button>
  </div>
  <div class="notice">Each day is saved separately on this device/browser.</div>
</section>

<section id="live" class="card hidden">
  <div class="live-top">
    <div><div class="live-day" id="liveDay"></div><div class="live-label">CURRENT PLAY</div><div class="live-name" id="liveName"></div></div>
    <div class="live-count" id="liveCount"></div>
  </div>
  <div class="timeline" id="timeline"></div>
  <div class="live-grid" id="liveGrid"></div>
  <div id="nextStrip" class="next-strip"></div>
  <div class="actions">
    <button class="secondary-btn" id="prevBtn">← Previous Play</button>
    <button class="secondary-btn" id="editBtn">Edit Plan</button>
    <button class="primary" id="nextBtn">Next Play →</button>
  </div>
</section>
</main>

<script>
const deployment={"4":[{"role":"Drive Thru Window","secondary":"Café POS","type":"non-planted"},{"role":"Bar","secondary":"DT POS","type":"non-planted"},{"role":"BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"Drive Thru Expo","secondary":"Café POS & Flex","type":"non-planted"}],"5":[{"role":"Drive Thru Window","secondary":"","type":"planted"},{"role":"Bar","secondary":"DT POS","type":"non-planted"},{"role":"BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"Drive Thru Expo","secondary":"Bar","type":"non-planted"},{"role":"Peak Captain (Flex)","secondary":"Café POS / Bottleneck","type":"non-planted"}],"6":[{"role":"Drive Thru Window","secondary":"","type":"planted"},{"role":"Café Bar","secondary":"DT POS","type":"non-planted"},{"role":"BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"Drive Thru Expo","secondary":"Bar","type":"non-planted"},{"role":"Peak Captain (Flex)","secondary":"Café POS / Bottleneck","type":"non-planted"},{"role":"DT Bar","secondary":"Café POS / Bottleneck","type":"non-planted"}],"7":[{"role":"Drive Thru Window","secondary":"","type":"planted"},{"role":"Café Bar","secondary":"","type":"planted"},{"role":"BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"Drive Thru Expo","secondary":"Bar","type":"non-planted"},{"role":"Peak Captain (Flex)","secondary":"Bottleneck","type":"non-planted"},{"role":"DT Bar","secondary":"","type":"planted"},{"role":"Café POS","secondary":"DT POS","type":"non-planted"}],"8":[{"role":"Drive Thru Window","secondary":"","type":"planted"},{"role":"Café Bar","secondary":"","type":"planted"},{"role":"BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"Drive Thru Expo","secondary":"Bar","type":"non-planted"},{"role":"Peak Captain (Flex)","secondary":"Bottleneck","type":"non-planted"},{"role":"DT Bar","secondary":"","type":"planted"},{"role":"Café POS","secondary":"DT POS","type":"non-planted"},{"role":"BOH Food","secondary":"Hot & Cold","type":"non-planted"}],"9":[{"role":"Drive Thru Window","secondary":"","type":"planted"},{"role":"Café Bar","secondary":"","type":"planted"},{"role":"BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"Drive Thru Expo","secondary":"Bar","type":"non-planted"},{"role":"Peak Captain (Flex)","secondary":"Bottleneck","type":"non-planted"},{"role":"DT Bar","secondary":"","type":"planted"},{"role":"Café POS","secondary":"DT POS","type":"non-planted"},{"role":"2nd BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"2nd Expo","secondary":"Bar","type":"non-planted"}],"10":[{"role":"Drive Thru Window","secondary":"","type":"planted"},{"role":"Café Bar","secondary":"","type":"planted"},{"role":"BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"Drive Thru Expo","secondary":"Bar","type":"non-planted"},{"role":"Peak Captain (Flex)","secondary":"Bottleneck","type":"non-planted"},{"role":"DT Bar","secondary":"","type":"planted"},{"role":"Café POS","secondary":"DT POS","type":"non-planted"},{"role":"2nd BOH Food","secondary":"Hot & Cold","type":"non-planted"},{"role":"2nd Expo","secondary":"Bar","type":"non-planted"},{"role":"2nd DT Bar","secondary":"BOH Food","type":"non-planted"}]};

const dayNames=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const defaults=()=>[
  {label:"Pre-Peak",people:4,names:{}},
  {label:"Peak",people:9,names:{}},
  {label:"Transition Out",people:5,names:{}}
];
function newDay(){return {playCount:3,plays:defaults()}}
function loadWeek(){
  const saved=JSON.parse(localStorage.getItem("bb_week")||"null");
  const week={};
  dayNames.forEach(d=>week[d]=saved&&saved[d]?saved[d]:newDay());
  return week;
}
function todayName(){
  const jsDay=new Date().getDay();
  return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][jsDay];
}
let week=loadWeek();
let selectedDay=localStorage.getItem("bb_selectedDay")||todayName();
if(!dayNames.includes(selectedDay)) selectedDay="Monday";
let currentPlay=0;

function dayData(){return week[selectedDay]}
function save(){localStorage.setItem("bb_week",JSON.stringify(week));localStorage.setItem("bb_selectedDay",selectedDay)}
function escapeHtml(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function roleKey(idx,item){return idx+"-"+item.role}
function renderDays(){
  dayTabs.innerHTML="";
  dayNames.forEach(day=>{
    const b=document.createElement("button");b.className="day-btn"+(day===selectedDay?" active":"");b.textContent=day.slice(0,3);
    b.title=day;
    b.onclick=()=>{selectedDay=day;save();renderSetup()};
    dayTabs.appendChild(b);
  });
  dayStatus.textContent=selectedDay+" plan • "+dayData().playCount+" plays";
}
function renderPlayCount(){
  twoBtn.classList.toggle("active",dayData().playCount===2);
  threeBtn.classList.toggle("active",dayData().playCount===3);
}
function renderSetup(){
  renderDays();renderPlayCount();
  const data=dayData();
  const grid=document.getElementById("planGrid");grid.innerHTML="";
  data.plays.slice(0,data.playCount).forEach((play,pIdx)=>{
    const card=document.createElement("div");card.className="plan-card";
    const staffButtons=[4,5,6,7,8,9,10].map(n=>`<button class="staff-btn ${n===play.people?"active":""}" data-n="${n}">${n}</button>`).join("");
    card.innerHTML=`
      <input class="play-label" value="${escapeHtml(play.label)}" aria-label="Play name">
      <div class="staff-label">Team members on floor</div>
      <div class="staff-row">${staffButtons}</div>
      <div class="roles"></div>`;
    card.querySelector(".play-label").addEventListener("input",e=>{play.label=e.target.value;save()});
    card.querySelectorAll(".staff-btn").forEach(btn=>btn.onclick=()=>{play.people=Number(btn.dataset.n);save();renderSetup()});
    const roles=card.querySelector(".roles");
    deployment[play.people].forEach((item,idx)=>{
      const key=roleKey(idx,item);
      const wrap=document.createElement("div");wrap.className="role";
      wrap.innerHTML=`
        <div class="num ${item.type}">${idx+1}</div>
        <div><div class="role-title">${item.role}</div>
        ${item.secondary?`<div class="secondary">→ ${item.secondary}</div>`:""}
        <input class="name-input" placeholder="Enter team member" value="${escapeHtml(play.names[key]||"")}"></div>`;
      wrap.querySelector("input").addEventListener("input",e=>{play.names[key]=e.target.value;save()});
      roles.appendChild(wrap);
    });
    grid.appendChild(card);
  });
}
function showLive(startIndex=0){
  save();currentPlay=Math.min(startIndex,dayData().playCount-1);
  setup.classList.add("hidden");live.classList.remove("hidden");renderLive();
}
function renderLive(){
  const data=dayData(),play=data.plays[currentPlay];
  liveDay.textContent=selectedDay;
  liveName.textContent=play.label||`Play ${currentPlay+1}`;
  liveCount.textContent=play.people;
  timeline.innerHTML="";
  data.plays.slice(0,data.playCount).forEach((p,idx)=>{
    const b=document.createElement("button");
    b.textContent=(p.label||`Play ${idx+1}`)+" • "+p.people;
    b.className=idx===currentPlay?"active":idx>currentPlay?"future":"";
    b.onclick=()=>{currentPlay=idx;renderLive()};
    timeline.appendChild(b);
  });
  liveGrid.innerHTML="";
  deployment[play.people].forEach((item,idx)=>{
    const div=document.createElement("div");div.className="live-role "+(item.type==="planted"?"is-planted":"");
    const key=roleKey(idx,item);
    div.innerHTML=`<div class="r">${idx+1}. ${item.role}</div>${item.secondary?`<div class="s">→ ${item.secondary}</div>`:""}<div class="who">${escapeHtml(play.names[key]||"— Open —")}</div>`;
    liveGrid.appendChild(div);
  });
  const next=currentPlay<data.playCount-1?data.plays[currentPlay+1]:null;
  nextStrip.innerHTML=next?`<span>UP NEXT</span><span><b>${escapeHtml(next.label||`Play ${currentPlay+2}`)}</b> • ${next.people} people</span>`:`<span>FINAL PLAY</span><span><b>Deployment complete</b></span>`;
  prevBtn.disabled=currentPlay===0;prevBtn.style.opacity=currentPlay===0?".45":"1";
  nextBtn.disabled=currentPlay===data.playCount-1;nextBtn.style.opacity=currentPlay===data.playCount-1?".45":"1";
}
function showSetup(){live.classList.add("hidden");setup.classList.remove("hidden");renderSetup()}

twoBtn.onclick=()=>{dayData().playCount=2;save();renderSetup()};
threeBtn.onclick=()=>{dayData().playCount=3;save();renderSetup()};
startBtn.onclick=()=>showLive(0);
editBtn.onclick=showSetup;
prevBtn.onclick=()=>{if(currentPlay>0){currentPlay--;renderLive()}};
nextBtn.onclick=()=>{if(currentPlay<dayData().playCount-1){currentPlay++;renderLive()}};
clearBtn.onclick=()=>{week[selectedDay]=newDay();save();renderSetup()};

renderSetup();
</script>
</body>
</html>
